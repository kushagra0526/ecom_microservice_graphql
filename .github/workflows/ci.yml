          JWT_SECRET: test-secret
          MONGO_URI: mongodb://localhost:27017/test-order
          NODE_ENV: test

  test-graphql-gateway:
    name: graphql-gateway tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphql-gateway
